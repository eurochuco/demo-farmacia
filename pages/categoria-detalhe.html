<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Categoria | Farmácia</title>
    <link rel="stylesheet" href="../style/categoria-detalhe.css">
    <link rel="stylesheet" href="../style/header-footer.css">
</head>
<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Banner da categoria (curvo, com link de voltar) -->
    <section class="categoria-banner">
        <a href="categorias.html" class="voltar-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Voltar para categorias
        </a>
        <h1 id="categoriaNome">Carregando...</h1>
        <p>Explorar subcategorias</p>
    </section>

    <!-- Conteúdo: sidebar + grid -->
    <section class="categoria-conteudo">

        <!-- Sidebar com todas as categorias -->
        <aside class="categoria-sidebar">
            <h3>Categorias</h3>
            <ul id="listaCategoriasSidebar">
                <!-- lista gerada dinamicamente aqui -->
            </ul>
        </aside>

        <!-- Grid de subcategorias -->
        <div class="categoria-principal">

            <div class="categoria-produtos-header">
                <h2 id="categoriaNomeRepetido">Carregando...</h2>
                <a href="#" class="ver-todos-link">Ver todos os produtos <span>&gt;</span></a>
            </div>

            <div class="grid-subcategorias" id="gridSubcategorias">
                <!-- cards gerados dinamicamente aqui -->
            </div>
        </div>

    </section>

    <!-- Mensagem de erro caso o categoryId não exista -->
    <section class="categoria-erro" id="categoriaErro" style="display: none;">
        <h2>Categoria não encontrada</h2>
        <p>A categoria que procuras não existe ou foi removida.</p>
        <a href="categorias.html" class="btn-voltar">Voltar às categorias</a>
    </section>

    <!-- Footer -->
    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../style/header-footer.js"></script>

    <script src="../style/categoria-detalhe.js"></script>
</body>
</html>
