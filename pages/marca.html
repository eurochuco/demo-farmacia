<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia — Marca</title>
    <link rel="stylesheet" href="../style/marca.css">
    <link rel="stylesheet" href="../style/header-footer.css">
</head>

<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- COLOCA AQUI O TEU HEADER/LOGO JÁ EXISTENTE -->

    <main class="marca-pagina">

        <section class="marca-banner" id="marcaBanner">
            <div class="marca-banner-texto" id="marcaBannerTexto"></div>
            <div class="marca-banner-imagens" id="marcaBannerImagens"></div>
        </section>

        <section class="marca-info">
            <div class="marca-logo" id="marcaLogo"></div>
            <div class="marca-info-texto">
                <h1 id="marcaNome">Marca</h1>
                <p id="marcaDescricao"></p>
            </div>
        </section>

        <section class="marca-produtos">

            <div class="marca-produtos-topo">
                <h2>Todos os Produtos</h2>
                <p id="marcaTotalResultados">0 resultados encontrados</p>
            </div>

            <div class="marca-toolbar-mobile">
                <button class="btn-toolbar-mobile" id="btnAbrirFiltrosMobile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                    Filtros
                </button>
                <button class="btn-toolbar-mobile" id="btnAbrirOrdenarMobile">
                    Ordenar por:
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

            <div class="marca-produtos-corpo">

                <aside class="marca-filtros" id="marcaFiltrosDesktop">
                    <div class="marca-filtros-header">
                        <h3>Filtros</h3>
                        <button class="marca-limpar-tudo" id="btnLimparFiltros">✕ Limpar tudo</button>
                    </div>

                    <div class="filtro-grupo">
                        <button class="filtro-grupo-titulo" data-alvo="filtroPreco">
                            Faixa de Preço (AOA)
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="18 15 12 9 6 15"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroPreco">
                            <div class="marca-preco-inputs">
                                <input type="number" placeholder="2" id="precoMin">
                                <span>—</span>
                                <input type="number" placeholder="999.999" id="precoMax">
                            </div>
                        </div>
                    </div>

                    <div class="filtro-grupo fechado">
                        <button class="filtro-grupo-titulo" data-alvo="filtroDesconto">
                            Desconto
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroDesconto"></div>
                    </div>

                    <div class="filtro-grupo fechado">
                        <button class="filtro-grupo-titulo" data-alvo="filtroCategoria">
                            Categoria
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroCategoria"></div>
                    </div>

                    <div class="filtro-grupo fechado">
                        <button class="filtro-grupo-titulo" data-alvo="filtroEstabelecimentos">
                            Estabelecimentos
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroEstabelecimentos"></div>
                    </div>

                    <div class="filtro-grupo fechado">
                        <button class="filtro-grupo-titulo" data-alvo="filtroMarcas">
                            Marcas
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroMarcas"></div>
                    </div>

                    <div class="filtro-grupo fechado">
                        <button class="filtro-grupo-titulo" data-alvo="filtroSeguradora">
                            Seguradora
                            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="filtro-grupo-corpo" id="filtroSeguradora"></div>
                    </div>
                </aside>

                <div class="marca-produtos-coluna">

                    <div class="marca-toolbar-desktop">
                        <div class="marca-paginacao" id="marcaPaginacaoTopo"></div>

                        <div class="marca-toolbar-direita">
                            <div class="marca-ordenar" id="marcaOrdenarDesktop">
                                <button class="marca-ordenar-btn" id="btnOrdenarDesktop">
                                    <span id="ordenarLabelDesktop">Ordenar por:</span>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                <div class="marca-ordenar-lista" id="ordenarListaDesktop"></div>
                            </div>

                            <div class="marca-view-toggle">
                                <button class="view-btn ativo" data-view="grid" aria-label="Grelha">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="3" y="3" width="7" height="7"></rect>
                                        <rect x="14" y="3" width="7" height="7"></rect>
                                        <rect x="3" y="14" width="7" height="7"></rect>
                                        <rect x="14" y="14" width="7" height="7"></rect>
                                    </svg>
                                </button>
                                <button class="view-btn" data-view="lista" aria-label="Lista">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <line x1="8" y1="6" x2="21" y2="6"></line>
                                        <line x1="8" y1="12" x2="21" y2="12"></line>
                                        <line x1="8" y1="18" x2="21" y2="18"></line>
                                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="marca-tags" id="marcaTags"></div>

                    <div class="marca-grelha" id="marcaGrelha"></div>

                    <div class="marca-paginacao" id="marcaPaginacaoBaixo"></div>

                </div>
            </div>
        </section>
    </main>

    <div class="marca-modal-overlay" id="modalFiltrosOverlay">
        <div class="marca-modal marca-modal-filtros">
            <div class="marca-modal-header">
                <h3>Filtros</h3>
                <button id="btnFecharFiltrosMobile">✕</button>
            </div>
            <div class="marca-modal-corpo" id="filtrosMobileCorpo"></div>
            <div class="marca-modal-rodape">
                <button class="btn-aplicar-filtros" id="btnAplicarFiltrosMobile">Aplicar</button>
            </div>
        </div>
    </div>

    <div class="marca-modal-overlay" id="modalOrdenarOverlay">
        <div class="marca-modal marca-modal-ordenar">
            <div class="marca-modal-header">
                <h3>Ordenar por:</h3>
                <button id="btnFecharOrdenarMobile">✕</button>
            </div>
            <div class="marca-modal-corpo" id="ordenarMobileCorpo"></div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../style/header-footer.js"></script>
    <script src="../style/catalogo.js"></script>
    <script src="../style/marca.js"></script>
</body>

</html>
