<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Promoção | Farmácia</title>
    <link rel="stylesheet" href="../style/promo-detalhe.css">
    <link rel="stylesheet" href="../style/header-footer.css">
</head>
<body>

    <!-- Header -->
    <div id="header-placeholder"></div>
    <!-- Breadcrumb / voltar -->
    <div class="promo-breadcrumb">
        <a href="index.html" class="voltar-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Voltar à página inicial
        </a>
    </div>

    <!-- Conteúdo da promoção -->
    <section class="promo-detalhe">

        <div class="promo-detalhe-grid">

            <!-- Imagem grande da promoção -->
            <div class="promo-detalhe-imagem">
                <img id="promoImagem" src="" alt="">
                <span class="promo-desconto-badge" id="promoDescontoBadge"></span>
            </div>

            <!-- Informações da promoção -->
            <div class="promo-detalhe-info">
                <span class="promo-tag">Promoção</span>
                <h1 id="promoTitulo">Carregando...</h1>
                <p class="promo-descricao" id="promoDescricao"></p>

                <div class="promo-preco-box">
                    <span class="promo-a-partir-de">A partir de</span>
                    <span class="promo-preco" id="promoPreco"></span>
                </div>

                <ul class="promo-detalhes-lista" id="promoDetalhesLista">
                    <!-- pontos adicionais gerados dinamicamente -->
                </ul>
            </div>

        </div>

        <!-- Vitrine de produtos da promoção -->
        <div class="promo-produtos-secao">
            <h2>Produtos desta <span>promoção</span></h2>
            <div class="promo-produtos-grid" id="promoProdutosGrid">
                <!-- cards gerados dinamicamente aqui -->
            </div>
        </div>

    </section>

    <!-- Mensagem de erro caso o promoId não exista -->
    <section class="promo-erro" id="promoErro" style="display: none;">
        <h2>Promoção não encontrada</h2>
        <p>A promoção que procuras não existe ou já terminou.</p>
        <a href="index.html" class="btn-voltar">Voltar à página inicial</a>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../style/header-footer.js"></script>
    <script src="../style/catalogo.js"></script>
    <script src="../style/promo-detalhe.js"></script>
</body>
</html>
